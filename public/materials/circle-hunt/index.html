<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>동그라미 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#E9EEF2;
  --card:#FFFFFF;
  --ink:#14293B;
  --ink-soft:#4A6478;
  --line:#CFDBE3;
  --brand:#0F8A80;
  --brand-ink:#0B615A;
  --brand-wash:#DDF0ED;
  --amber:#D9821C;
  --amber-wash:#FBEBD5;
  --shadow:0 18px 44px -26px rgba(20,41,59,.6);
  --mark:#12293C;
  --hint:#E08A16;
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A22;
    --card:#17252E;
    --ink:#E7EFF3;
    --ink-soft:#9DB3C0;
    --line:#2B3F4B;
    --brand:#2EC0B4;
    --brand-ink:#8FE6DD;
    --brand-wash:#123A38;
    --amber:#F0A94E;
    --amber-wash:#3B2A15;
    --shadow:0 18px 44px -26px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A22; --card:#17252E; --ink:#E7EFF3; --ink-soft:#9DB3C0; --line:#2B3F4B;
  --brand:#2EC0B4; --brand-ink:#8FE6DD; --brand-wash:#123A38; --amber:#F0A94E; --amber-wash:#3B2A15;
  --shadow:0 18px 44px -26px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
.app{
  height:100dvh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:16px clamp(14px,3vw,34px) 18px;
}
h1,h2,h3,.display{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.01em}

/* ── 머리말 ───────────────────────────── */
.topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand-mark{width:42px;height:42px;flex:none}
.brand h1{margin:0;font-size:clamp(21px,2.4vw,30px);line-height:1}
.brand p{margin:3px 0 0;font-size:13px;color:var(--ink-soft)}
.steps{display:flex;align-items:center;gap:8px}
.step{
  width:38px;height:38px;border-radius:50%;border:2px solid var(--line);
  background:var(--card);color:var(--ink-soft);
  font-family:"Jua","Noto Sans KR",sans-serif;font-size:17px;line-height:1;
  display:grid;place-items:center;cursor:pointer;
  transition:transform .15s ease,background .2s,border-color .2s,color .2s;
}
.step:hover:not(:disabled){transform:translateY(-2px)}
.step[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.step.done{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-wash)}
.step:disabled{cursor:not-allowed;opacity:.45}
.level{
  display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;
  background:var(--amber-wash);color:var(--amber);border:1.5px solid currentColor;
  font-family:"Jua","Noto Sans KR",sans-serif;font-size:15px;white-space:nowrap;
}
.level b{font-weight:400;color:var(--ink)}

/* ── 무대 ─────────────────────────────── */
.stage{
  flex:1;min-height:0;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
}
.scene-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;justify-content:center;text-align:center}
.scene-head h2{margin:0;font-size:clamp(19px,2.1vw,26px)}
.scene-head p{margin:0;font-size:14px;color:var(--ink-soft)}
.frame{
  position:relative;flex:0 0 auto;width:100%;max-width:100%;aspect-ratio:1000/620;
  background:var(--card);
  border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);
  overflow:hidden;
}
svg.scene{display:block;width:100%;height:100%;touch-action:manipulation}

.target{
  stroke:rgba(18,41,60,.3);stroke-width:2;paint-order:stroke;cursor:pointer;
  transition:stroke .2s ease,stroke-width .2s ease;
}
.item:hover .target{stroke:rgba(18,41,60,.6);stroke-width:5}
.target:focus-visible{outline:none;stroke:var(--hint);stroke-width:6}
.target.found{stroke:var(--mark);stroke-width:10}
.target.hint{stroke:var(--hint);stroke-width:9;stroke-dasharray:16 11;animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-54}}
.item .deco{pointer-events:none}
.item.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
.item.nope{animation:nope .45s ease;transform-box:fill-box;transform-origin:center}
@keyframes nope{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-2deg)}50%{transform:translateX(7px) rotate(2deg)}80%{transform:translateX(-4px)}}
.ripple{fill:none;stroke:var(--mark);stroke-width:6;transform-box:fill-box;transform-origin:center;animation:ripple .75s ease-out forwards;pointer-events:none}
@keyframes ripple{0%{transform:scale(.94);opacity:.85}100%{transform:scale(1.55);opacity:0}}
.badge{pointer-events:none;transform-box:fill-box;transform-origin:center;animation:badge .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes badge{from{transform:scale(0)}to{transform:scale(1)}}

/* ── 상태 문구 ────────────────────────── */
.say{
  min-height:30px;display:flex;align-items:center;gap:9px;padding:5px 16px;border-radius:999px;
  font-size:clamp(14px,1.5vw,17px);background:transparent;color:var(--ink-soft);transition:.2s;
}
.say.good{background:var(--brand-wash);color:var(--brand-ink);font-weight:700}
.say.bad{background:var(--amber-wash);color:var(--amber);font-weight:700}

/* ── 꼬리말 ───────────────────────────── */
.bottombar{display:flex;align-items:center;gap:clamp(12px,2vw,26px);flex-wrap:wrap}
.count{display:flex;align-items:center;gap:12px;margin-right:auto}
.count-num{font-family:"Jua","Noto Sans KR",sans-serif;font-size:clamp(18px,2vw,24px);white-space:nowrap}
.count-num b{color:var(--brand-ink);font-weight:400;font-size:1.25em}
.pips{display:flex;gap:7px;flex-wrap:wrap}
.pip{width:19px;height:19px;border-radius:50%;border:2.5px solid var(--line);background:transparent;transition:.25s}
.pip.on{background:var(--brand);border-color:var(--brand);transform:scale(1.08)}
.pip.hinted{border-color:var(--hint);border-style:dashed}
.btn{
  font-family:"Jua","Noto Sans KR",sans-serif;font-size:clamp(15px,1.7vw,19px);
  padding:12px 22px;border-radius:14px;border:2px solid transparent;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease,filter .2s,background .2s;
  background:var(--card);color:var(--ink);border-color:var(--line);
}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn-hint{background:var(--amber-wash);color:var(--amber);border-color:currentColor}
.btn-next{background:var(--brand);color:#fff;border-color:var(--brand);padding-inline:26px}
.btn-next:disabled{background:var(--card);color:var(--ink-soft);border-color:var(--line);cursor:not-allowed;opacity:.7}
.btn-next.ready{animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(15,138,128,.5)}60%{box-shadow:0 0 0 14px rgba(15,138,128,0)}}
.lockmsg{font-size:13px;color:var(--ink-soft)}

/* ── 축하 오버레이 ────────────────────── */
.cheer{
  position:absolute;inset:0;display:grid;place-items:center;padding:20px;
  background:rgba(12,26,36,.42);backdrop-filter:blur(2px);
  opacity:0;visibility:hidden;transition:opacity .3s;
}
.cheer.show{opacity:1;visibility:visible}
.cheer-card{
  background:var(--card);border-radius:22px;padding:clamp(22px,3vw,34px) clamp(26px,4vw,46px);
  text-align:center;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);position:relative;max-width:min(560px,92%);
}
.cheer-card h3{margin:0 0 8px;font-size:clamp(22px,2.8vw,32px)}
.cheer-card p{margin:0 0 20px;color:var(--ink-soft);font-size:15px;line-height:1.6}
.cheer-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.close-x{
  position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;
  border:none;background:transparent;color:var(--ink-soft);font-size:20px;cursor:pointer;line-height:1;
}
.close-x:hover{background:var(--paper)}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-24px;border-radius:50%;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg);opacity:.15}}

.hidden{display:none !important}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.05ms !important}
}
@media (max-width:1200px){
  .lockmsg{display:none}
  .btn{padding:11px 16px}
  .bottombar{gap:10px}
}
@media (max-width:820px){
  .brand p,.scene-head p{display:none}
  .app{gap:8px;padding:10px}
  .btn{padding:9px 13px;border-radius:12px}
  .step{width:32px;height:32px;font-size:15px}
  .count{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="22" r="19" fill="none" stroke="var(--brand)" stroke-width="4"/>
        <circle cx="22" cy="22" r="6" fill="var(--amber)"/>
      </svg>
      <div>
        <h1>동그라미 탐험대</h1>
        <p>그림 속에서 <b>원</b>을 찾아 눌러 보세요</p>
      </div>
    </div>
    <nav class="steps" id="steps" aria-label="단계 이동"></nav>
    <span class="level">난이도 <b id="levelName">아주 쉬움</b></span>
  </header>

  <main class="stage">
    <div class="scene-head">
      <h2 id="sceneTitle">1단계 · 우리 교실</h2>
      <p id="sceneHint"></p>
    </div>

    <div class="frame">
      <svg class="scene" id="scene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"
           role="group" aria-label="원을 찾을 그림"></svg>
      <div class="cheer" id="cheer" role="dialog" aria-modal="false" aria-labelledby="cheerTitle">
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <div class="cheer-card">
          <button class="close-x" id="cheerClose" aria-label="닫고 그림 다시 보기">✕</button>
          <h3 id="cheerTitle">원을 모두 찾았어요!</h3>
          <p id="cheerText"></p>
          <div class="cheer-actions" id="cheerActions"></div>
        </div>
      </div>
    </div>

    <p class="say" id="say" role="status" aria-live="polite"></p>
  </main>

  <footer class="bottombar">
    <div class="count">
      <span class="count-num">원 <b id="foundNum">0</b> / <span id="totalNum">3</span> 개</span>
      <span class="pips" id="pips" aria-hidden="true"></span>
    </div>
    <span class="lockmsg" id="lockmsg">원을 모두 찾으면 다음 페이지가 열려요</span>
    <button class="btn btn-hint" id="btnHint">정답 보기</button>
    <button class="btn" id="btnReset">다시하기</button>
    <button class="btn" id="btnPrev" title="이전 페이지를 처음부터 다시 풉니다">← 이전</button>
    <button class="btn btn-next" id="btnNext">다음 페이지 →</button>
  </footer>
</div>

<script>

  var el = function (cx, cy, rx, ry, fill, a) { return { t: "ellipse", a: Object.assign({ cx: cx, cy: cy, rx: rx, ry: ry, fill: fill }, a || {}) }; };
  var rc = function (x, y, w, h, fill, a) { return { t: "rect", a: Object.assign({ x: x, y: y, width: w, height: h, fill: fill }, a || {}) }; };
  var pg = function (points, fill, a) { return { t: "polygon", a: Object.assign({ points: points, fill: fill }, a || {}) }; };
  var pt = function (d, fill, a) { return { t: "path", a: Object.assign({ d: d, fill: fill }, a || {}) }; };
  var ln = function (x1, y1, x2, y2, stroke, w) {
    return { t: "line", a: { x1: x1, y1: y1, x2: x2, y2: y2, stroke: stroke, "stroke-width": w || 6, "stroke-linecap": "round" } };
  };
  var item = function (name, isCircle, base, over) { return { name: name, ans: !!isCircle, base: base, over: over || [] }; };
  var onRim = function (cx, cy, r, deg) {
    var t = (deg * Math.PI) / 180;
    return [cx + r * Math.cos(t), cy - r * Math.sin(t)];
  };

  /* 종이 콜라주 팔레트 */
  var SKY = "#CCE7F5", SKY2 = "#B7DDF0", GRASS = "#A9D287", DIRT = "#C9A06D",

  /* ── 1단계 · 우리 교실 ───────────────────────── */

      item("창문", false, rc(818, 84, 152, 168, SKY, { rx: 6 }), [

      item("훌라후프", true, c(200, 360, 80, PINK), [

    ]

  /* ── 2단계 · 놀이터 ─────────────────────────── */
  var scene2 = {
    title: "놀이터",
    level: "쉬움",
    hint: "구름은 옆으로 길쭉해요. 원일까요?",
    bg: [
      rc(0, 0, 1000, 430, SKY),
      rc(0, 400, 1000, 220, GRASS),
      pt("M 0 412 Q 250 386 500 406 T 1000 400 L 1000 430 L 0 430 Z", "#96C476"),

      pt("M 620 480 L 690 388 L 790 480 M 690 388 L 620 480 L 790 480", "none",

      item("미끄럼틀", false, pg("108,432 108,244 214,244 330,432", "#E9765F"), [

  /* ── 3단계 · 식탁 위 ────────────────────────── */
  var scene3 = {
    title: "식탁 위",
    level: "보통",
    hint: "위에서 본 접시 중에 길쭉한 것도 있어요",
    bg: [
      rc(0, 0, 1000, 620, "#E7DBC4"),
      rc(0, 150, 1000, 10, "rgba(180,140,90,.22)"),

    ],
    items: [
      item("도마", false, rc(58, 74, 232, 132, "#BE8347", { rx: 26 }), [

        pt("M 92 140 L 250 140", "none", { class: "deco", stroke: "rgba(90,60,30,.25)", "stroke-width": 5 })
      ]),
      item("타원 접시", false, el(486, 148, 124, 74, CREAM), [

      ]),

  function draw() {
    var scene = SCENES[page];
    svg.textContent = "";
    scene.bg.forEach(function (spec) {
      var node = make(spec);
      node.setAttribute("pointer-events", "none");
      svg.appendChild(node);
    });

    scene.items.forEach(function (it, idx) {
      var g = document.createElementNS(NS, "g");
      g.setAttribute("class", "item");
      var base = make(it.base);
      base.setAttribute("class", "target");
      base.setAttribute("tabindex", "0");
      base.setAttribute("role", "button");
      base.setAttribute("aria-label", it.name);
      g.appendChild(base);
      it.over.forEach(function (spec) {
        var node = make(spec);
        node.setAttribute("class", (spec.a.class ? spec.a.class + " " : "") + "deco");
        g.appendChild(node);
      });
      svg.appendChild(g);

      if (found[page][idx]) {
        base.classList.add("found");
        base.setAttribute("aria-label", it.name + " · 찾은 원");
        addBadge(base);
      } else if (hinted[page] && it.ans) {
        base.classList.add("hint");
      }

      var pick = function (ev) { ev.preventDefault(); choose(idx, g, base); };
      base.addEventListener("click", pick);

      });

    var g = document.createElementNS(NS, "g");

      g.classList.add("nope");
      setTimeout(function () { g.classList.remove("nope"); }, 500);

      return;
    }

    found[page][idx] = true;
    base.classList.add("found");
    base.classList.remove("hint");
    base.setAttribute("aria-label", it.name + " · 찾은 원");
    g.classList.add("pop");
    setTimeout(function () { g.classList.remove("pop"); }, 500);
    ripple(base);
    addBadge(base);

    speak(left > 0 ? it.name + "에서 원을 찾았어요! " + left + "개 남았어요" : it.name + "까지 찾았어요!", "good");

    $("foundNum").textContent = got;
    $("totalNum").textContent = total;

    var pips = $("pips");
    pips.textContent = "";
    for (var i = 0; i < total; i++) {
      var pip = document.createElement("span");
      pip.className = "pip" + (i < got ? " on" : hinted[page] ? " hinted" : "");
      pips.appendChild(pip);
    }

    steps.textContent = "";
    SCENES.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "step" + (isDone(i) ? " done" : "");
      b.textContent = isDone(i) ? "✓" : String(i + 1);
      b.title = (i + 1) + "단계 · " + s.title;
      b.setAttribute("aria-label", (i + 1) + "단계 " + s.title);
      if (i === page) b.setAttribute("aria-current", "true");
      b.disabled = i + 1 > unlocked;
      b.addEventListener("click", function () { (i < page ? restart : go)(i); });
      steps.appendChild(b);
    });

    var open = isDone(page) || hinted[page];
    if (open) unlocked = Math.max(unlocked, Math.min(SCENES.length, page + 2));
    var next = $("btnNext");
    next.disabled = !open || page === SCENES.length - 1;
    next.classList.toggle("ready", open && page < SCENES.length - 1);
    next.textContent = page === SCENES.length - 1 ? "마지막 페이지" : "다음 페이지 →";
    $("btnPrev").disabled = page === 0;

    $("lockmsg").textContent = isDone(page)
      ? "잘했어요! 다음 페이지로 넘어가 보세요"
      : "원을 모두 찾으면 다음 페이지가 열려요";
  }

    $("cheerText").textContent = last
      ? "우리 주변에는 이렇게 많은 원이 숨어 있어요. 교실에서도 원을 찾아볼까요?"
      : SCENES[page].title + "에서 원 " + total + "개를 찾았어요." +
        (hinted[page] ? " 다음 페이지는 정답 없이 도전해 볼까요?" : " 다음 페이지는 조금 더 어려워요!");

    var actions = $("cheerActions");
    actions.textContent = "";
    if (last) {
      actions.appendChild(button("처음부터 다시하기", "btn btn-next", function () {
        SCENES.forEach(function (s, i) { found[i] = {}; hinted[i] = false; });
        unlocked = 1;
        go(0);
      }));
    } else {
      actions.appendChild(button("다음 페이지 →", "btn btn-next", function () { go(page + 1); }));
    }
    actions.appendChild(button("그림 더 보기", "btn", function () { cheer.classList.remove("show"); }));

    confetti();
    cheer.classList.add("show");
    var first = actions.querySelector("button");
    if (first) first.focus();
  }

  function button(label, cls, fn) {
    var b = document.createElement("button");
    b.className = cls;
    b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  }

  function confetti() {
    var box = $("confetti");
    box.textContent = "";
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var colors = ["#0F8A80", "#F2C33C", "#E4574C", "#4C86D6", "#F0688E", "#57B871"];
    for (var i = 0; i < 28; i++) {
      var dot = document.createElement("i");
      var size = 10 + Math.random() * 14;
      dot.style.left = Math.random() * 100 + "%";
      dot.style.width = size + "px";
      dot.style.height = size + "px";
      dot.style.background = colors[i % colors.length];
      dot.style.animationDuration = 2.2 + Math.random() * 1.6 + "s";
      dot.style.animationDelay = Math.random() * 0.7 + "s";
      box.appendChild(dot);
    }
    setTimeout(function () { box.textContent = ""; }, 4200);
  }

  /* ── 화면에 꼭 맞추기 ───────────────────────── */
  var stageEl = document.querySelector(".stage");
  var frameEl = document.querySelector(".frame");
  var lastW = 0;
  function fit() {
    var head = document.querySelector(".scene-head");
    var room = stageEl.clientHeight - head.offsetHeight - say.offsetHeight - 24;
    var w = Math.max(260, Math.round(Math.min(stageEl.clientWidth, room * (1000 / 620))));
    if (w !== lastW) { lastW = w; frameEl.style.width = w + "px"; }
  }
  window.addEventListener("resize", fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stageEl);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit)["catch"](function () {});

  /* ── 버튼 ──────────────────────────────────── */
  $("btnNext").addEventListener("click", function () { if (page < SCENES.length - 1) go(page + 1); });
  $("btnPrev").addEventListener("click", function () { if (page > 0) restart(page - 1); });
  $("btnReset").addEventListener("click", function () { restart(page, "이 페이지를 처음부터 다시 찾아보세요"); });
  $("btnHint").addEventListener("click", function () {
    hinted[page] = !hinted[page];
    draw();
    refresh();
    speak(hinted[page]
      ? "주황색 점선이 아직 찾지 못한 원이에요"
      : "정답을 숨겼어요. 다시 찾아볼까요?");
  });
  $("cheerClose").addEventListener("click", function () { cheer.classList.remove("show"); });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") cheer.classList.remove("show");
  });

  go(0);
})();
</script>
</body>
</html>
