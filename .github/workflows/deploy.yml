name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/prd-implementation-aq7hsn]
  workflow_dispatch: # 저장소 Actions 탭에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 푸시해도 마지막 것만 배포되도록 한다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # 저장소 Settings > Pages 에서 Source를 "GitHub Actions"로 한 번 켜 두어야 한다.
      # 워크플로 토큰으로는 Pages 사이트를 생성할 권한이 없다.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
